{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Economic Charts</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->
    <link href="{% static 'data_visualization/css/navbar.css' %}" rel="stylesheet">
    <link href="{% static 'data_visualization/css/economic_charts.css' %}" rel="stylesheet">
    <link href="{% static 'data_visualization/css/error_modal.css' %}" rel="stylesheet">
</head>

<body>
    {% include "data_visualization/_navbar.html" %}
    <div class="header">
        <div class="header-form">
            <div class="region-section">
                <label class="region-label">Region:</label>
                <div class="region-buttons" id="region-buttons">
                    <button type="button" class="region-btn" data-region="US">US</button>
                    <button type="button" class="region-btn" data-region="EU">EU</button>
                    <button type="button" class="region-btn" data-region="FR">FR</button>
                    <button type="button" class="region-btn" data-region="JP">JP</button>
                </div>
            </div>
            <form method="get">
                <input type="hidden" id="region" name="region" value="{{ region }}">
            </form>
            <div class="period-window-section">
                <label for="period-window" class="period-window-label">Chart Period:</label>
                <select id="period-window" class="chart-select" name="period_window" aria-label="Chart period">
                    {% for option in period_window_options %}
                    <option value="{{ option }}"{% if option == period_window %} selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <!-- Chart Grid -->
    <div class="chart-grid" id="chart-grid">
        <!-- Charts will be populated by JavaScript -->
    </div>

    <script>
        window.dropdownValuesJSON = {{ dropdown_values | safe }};
        window.economicDataJSON = {{ economic_data | safe }};
        window.categoriesJSON = {{ categories | safe }};
        window.selectedValuesJSON = {{ selected_values | safe }};
        window.currentRegion = "{{ region }}";
    </script>
    <script src="{% static 'data_visualization/js/errors.js' %}"></script>
    {% if error_messages %}
    <script>
        window.errorMessages = {{ error_messages|safe }};
    </script>
    {% endif %}
    <script src="{% static 'data_visualization/js/economic_charts.js' %}"></script>

</body>

</html>
