services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  webapp:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../:/app
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      - RUN_COLLECTSTATIC=1
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile
    command: celery -A core worker --loglevel=info
    volumes:
      - ../../:/app
    env_file:
      - ../../.env
    environment:
      - RUN_COLLECTSTATIC=0
    depends_on:
      - redis
      - webapp
    restart: unless-stopped

  celery-beat:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile
    command: celery -A core beat --loglevel=info
    volumes:
      - ../../:/app
    env_file:
      - ../../.env
    environment:
      - RUN_COLLECTSTATIC=0
    depends_on:
      - redis
      - webapp
    restart: unless-stopped

  flower:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile
    command: celery -A core flower --port=5555
    volumes:
      - ../../:/app
    env_file:
      - ../../.env
    environment:
      - RUN_COLLECTSTATIC=0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
      - celery-beat
    restart: unless-stopped
